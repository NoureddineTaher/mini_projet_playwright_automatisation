
name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1 : TESTS API
  # ============================================================
  test_api:
    name: Tests API
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      BASE_URL_API: https://jsonplaceholder.typicode.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npx playwright test tests/api-credit.spec.ts

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore


  # ============================================================
  # JOB 2 : TESTS UI
  # ============================================================
  test_ui:
    name: Tests UI
    needs: test_api
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL_UI: https://www.caisse-epargne.fr/comptes-cartes/le-credit-renouvelable-izicarte/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test --grep "TC-"

      - name: Upload UI Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: playwright-report/


  # ============================================================
  # JOB 3 : DEPLOYMENT GITHUB PAGES
  # ============================================================
  deploy:
    name: Deploy GitHub Pages
    needs: [test_api, test_ui]

    if: github.event_name != 'pull_request' && success()

    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # JOB 4 : EMAIL SI SUCCÈS
  # ============================================================
  notify_success:
    name: Notification succès
    needs: [test_api, test_ui, deploy]

    if: success() && github.event_name != 'pull_request'

    runs-on: ubuntu-24.04

    steps:
      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.mail.yahoo.com
          server_port: 465

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "Succès - Pipeline Playwright - ${{ github.repository }}"

          to: noureddine_taher@yahoo.com

          from: GitHub Actions

          body: |
            Bonjour Noureddine,

            Le pipeline Playwright s'est terminé avec